<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15181f"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.2" cy="0.1" r="1">
      <stop offset="0%" stop-color="#2a2f3a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#15181f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qStroke" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#2a7bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)"/>
  <rect x="36" y="36" width="952" height="952" rx="200" fill="none" stroke="#222735" stroke-width="8"/>
  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="250" fill="none" stroke="url(#qStroke)" stroke-width="110" stroke-linecap="round"/>
    <line x1="640" y1="640" x2="780" y2="780" stroke="url(#qStroke)" stroke-width="110" stroke-linecap="round"/>
  </g>
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#qStroke)" stroke-width="100" stroke-linecap="round"/>
  <line x1="640" y1="640" x2="780" y2="780" stroke="url(#qStroke)" stroke-width="100" stroke-linecap="round"/>
</svg>
