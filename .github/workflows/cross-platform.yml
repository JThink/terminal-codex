name: Cross-platform

on:
  push:
    branches:
      - main
      - dev-win
  pull_request:
    branches:
      - main
      - dev-win
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact_name: terminal-codex-macos
            artifact_path: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            artifact_name: terminal-codex-windows
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install frontend tooling
        run: npm ci --ignore-scripts

      - name: Test frontend logic
        run: npm test

      - name: Check frontend syntax
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build native installer
        run: npm run tauri:build

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
